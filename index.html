<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGO — Login</title>
    <meta name="description" content="UniGO Smart University Transport Platform - Login to access your dashboard">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="public/css/custom.css">
    <script src="public/js/student-module.js"></script>
</head>

<body>
    <div class="login-bg">
        <!-- Floating orbs -->
        <div
            id="orb1" style="position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(139,92,246,0.08),transparent);top:20%;left:10%;border-radius:50%;animation:pulse-glow 4s infinite;">
        </div>
        <div
            id="orb2" style="position:absolute;width:150px;height:150px;background:radial-gradient(circle,rgba(6,182,212,0.06),transparent);bottom:30%;right:15%;border-radius:50%;animation:pulse-glow 5s infinite 1s;">
        </div>

        <div class="login-card" id="loginCard" style="border-top: 4px solid #8B5CF6;">
            <!-- Logo -->
            <div style="text-align:center;margin-bottom:32px;">
                <div
                    id="logoBg" style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;transition:background 0.3s ease;">
                    <svg width="32" height="32" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
                        <path d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10M17 16V8h3l2 4v4" />
                    </svg>
                </div>
                <h1
                    style="font-family:'Outfit',sans-serif;font-size:1.75rem;font-weight:700;color:var(--text-primary);">
                    Uni<span id="logoText" style="color:#818CF8;transition:color 0.3s ease;">GO</span>
                </h1>
                <p style="color:var(--text-muted);font-size:0.9rem;margin-top:4px;">Smart University Transport Platform
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Role Selector Tabs -->
                <div class="tabs" style="margin-bottom: 24px; display:flex; gap: 8px;">
                    <div class="tab active" id="tabAdmin" onclick="selectRole('admin')" style="flex:1; text-align:center; padding:12px; border-radius:12px; background:rgba(99, 102, 241, 0.1); color:var(--text-primary); cursor:pointer; font-weight:600;">Admin</div>
                    <div class="tab" id="tabDriver" onclick="selectRole('driver')" style="flex:1; text-align:center; padding:12px; border-radius:12px; background:var(--bg-card); color:var(--text-muted); cursor:pointer; font-weight:600; border: 1px solid var(--border-light);">Driver</div>
                    <div class="tab" id="tabStudent" onclick="selectRole('student')" style="flex:1; text-align:center; padding:12px; border-radius:12px; background:var(--bg-card); color:var(--text-muted); cursor:pointer; font-weight:600; border: 1px solid var(--border-light);">Student</div>
                </div>
                <input type="hidden" id="selectedRole" value="admin">
                <div id="studentSessionWrap" style="display:none;margin-bottom:16px;">
                    <label class="form-label">Session</label>
                    <select id="studentSession" class="form-input form-select"></select>
                </div>

                <!-- Error Message Container -->
                <div id="errorMessage"
                    style="display:none; color: #F87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 0.85rem; text-align: center;">
                    Invalid email or password. Try again!
                </div>

                <div style="margin-bottom:16px;">
                    <label class="form-label" id="userIdLabel">Email Address</label>
                    <div style="position:relative;">
                        <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);"
                            width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24" id="userIdIcon">
                            <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <input type="text" id="email" class="form-input" placeholder="admin@must.edu.pk" required
                            style="padding-left:40px;">
                    </div>
                </div>

                <div style="margin-bottom:16px;">
                    <label class="form-label">Password</label>
                    <div style="position:relative;">
                        <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);"
                            width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0110 0v4" />
                        </svg>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required
                            style="padding-left:40px;padding-right:40px;">
                        <button type="button" onclick="togglePassword()"
                            style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
                            <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                                viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
                    <label
                        style="display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--text-secondary);cursor:pointer;">
                        <input type="checkbox" style="accent-color:#6366F1;width:16px;height:16px;">
                        Remember me
                    </label>
                    <a href="#" style="font-size:0.8rem;color:#818CF8;text-decoration:none;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width:100%;justify-content:center;padding:12px;font-size:0.95rem;" id="loginBtn">
                    <span id="loginText">Sign In</span>
                    <svg id="loginSpinner" style="display:none;animation:spin 1s linear infinite;" width="18"
                        height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path
                            d="M12 2v4m0 12v4m-7.07-3.93l2.83-2.83m8.49-8.49l2.83-2.83M2 12h4m12 0h4m-3.93 7.07l-2.83-2.83M6.34 6.34L3.51 3.51" />
                    </svg>
                </button>
            </form>

            <div style="text-align:center;margin-top:24px;">
                <p style="color:var(--text-muted);font-size:0.85rem;">Student accounts are created by admin with an initial random password.</p>
            </div>
        </div>
    </div>

    <script>
        function selectRole(role) {
            document.getElementById('selectedRole').value = role;
            const tabAdmin = document.getElementById('tabAdmin');
            const tabDriver = document.getElementById('tabDriver');
            const tabStudent = document.getElementById('tabStudent');
            const label = document.getElementById('userIdLabel');
            const input = document.getElementById('email');
            const icon = document.getElementById('userIdIcon');
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            // Global color elements
            const loginCard = document.getElementById('loginCard');
            const logoBg = document.getElementById('logoBg');
            const logoText = document.getElementById('logoText');
            const orb1 = document.getElementById('orb1');
            const orb2 = document.getElementById('orb2');
            const studentSessionWrap = document.getElementById('studentSessionWrap');

            errorMsg.style.display = 'none';

            if(role === 'admin') {
                // Purple Theme (Admin)
                tabAdmin.style.background = 'rgba(139, 92, 246, 0.1)';
                tabAdmin.style.color = 'var(--text-primary)';
                tabAdmin.style.border = 'none';
                
                tabDriver.style.background = 'var(--bg-card)';
                tabDriver.style.color = 'var(--text-muted)';
                tabDriver.style.border = '1px solid var(--border-light)';
                tabStudent.style.background = 'var(--bg-card)';
                tabStudent.style.color = 'var(--text-muted)';
                tabStudent.style.border = '1px solid var(--border-light)';

                label.innerText = 'Email Address';
                input.type = 'text';
                input.placeholder = 'admin@must.edu.pk';
                input.value = '';
                studentSessionWrap.style.display = 'none';
                btn.style.background = '#8B5CF6';
                btn.style.borderColor = '#8B5CF6';
                icon.innerHTML = '<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />';
                
                // Global Accents
                loginCard.style.borderTop = '4px solid #8B5CF6';
                logoBg.style.background = 'linear-gradient(135deg,#6366F1,#8B5CF6)';
                logoText.style.color = '#818CF8';
                if(orb1) orb1.style.background = 'radial-gradient(circle,rgba(139,92,246,0.08),transparent)';
                if(orb2) orb2.style.background = 'radial-gradient(circle,rgba(6,182,212,0.06),transparent)';
            } else if (role === 'driver') {
                // Emerald Theme (Driver)
                tabDriver.style.background = 'rgba(16, 185, 129, 0.1)';
                tabDriver.style.color = 'var(--text-primary)';
                tabDriver.style.border = 'none';
                
                tabAdmin.style.background = 'var(--bg-card)';
                tabAdmin.style.color = 'var(--text-muted)';
                tabAdmin.style.border = '1px solid var(--border-light)';
                tabStudent.style.background = 'var(--bg-card)';
                tabStudent.style.color = 'var(--text-muted)';
                tabStudent.style.border = '1px solid var(--border-light)';

                label.innerText = 'Driver License No.';
                input.type = 'text';
                input.placeholder = 'e.g. HTV-1234';
                input.value = '';
                studentSessionWrap.style.display = 'none';
                btn.style.background = '#10B981';
                btn.style.borderColor = '#10B981';
                icon.innerHTML = '<path d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3h8l.778 7H3.222L6 10z"/>';
                
                // Global Accents
                loginCard.style.borderTop = '4px solid #10B981';
                logoBg.style.background = 'linear-gradient(135deg,#059669,#10B981)';
                logoText.style.color = '#10B981';
                if(orb1) orb1.style.background = 'radial-gradient(circle,rgba(16,185,129,0.08),transparent)';
                if(orb2) orb2.style.background = 'radial-gradient(circle,rgba(52,211,153,0.06),transparent)';
            } else {
                tabStudent.style.background = 'rgba(59, 130, 246, 0.12)';
                tabStudent.style.color = 'var(--text-primary)';
                tabStudent.style.border = 'none';
                tabAdmin.style.background = 'var(--bg-card)';
                tabAdmin.style.color = 'var(--text-muted)';
                tabAdmin.style.border = '1px solid var(--border-light)';
                tabDriver.style.background = 'var(--bg-card)';
                tabDriver.style.color = 'var(--text-muted)';
                tabDriver.style.border = '1px solid var(--border-light)';

                label.innerText = 'Roll No Suffix';
                input.type = 'text';
                input.placeholder = 'e.g. BCS-001';
                input.value = '';
                studentSessionWrap.style.display = 'block';
                btn.style.background = '#3B82F6';
                btn.style.borderColor = '#3B82F6';
                icon.innerHTML = '<path d="M12 4l8 4-8 4-8-4 8-4zm0 9l8-4v7l-8 4-8-4V9l8 4z"/>';

                loginCard.style.borderTop = '4px solid #3B82F6';
                logoBg.style.background = 'linear-gradient(135deg,#2563EB,#3B82F6)';
                logoText.style.color = '#60A5FA';
                if(orb1) orb1.style.background = 'radial-gradient(circle,rgba(59,130,246,0.08),transparent)';
                if(orb2) orb2.style.background = 'radial-gradient(circle,rgba(96,165,250,0.06),transparent)';
            }
        }
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"/>';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('selectedRole').value;
            const inputVal = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const text = document.getElementById('loginText');
            const spinner = document.getElementById('loginSpinner');
            const errorMsg = document.getElementById('errorMessage');

            errorMsg.style.display = 'none';

            if(role === 'admin') {
                if (!inputVal.endsWith('@must.edu.pk') || password.length < 6) {
                    errorMsg.innerText = 'Invalid Admin Email or Password. Minimum 6 characters required.';
                    errorMsg.style.display = 'block';
                    return;
                }
            } else if (role === 'driver') {
                let driversList = JSON.parse(localStorage.getItem('uniGoDrivers')) || [
                    { id: 'HTV-001', name: 'Saran Zafar', bus: 'None' },
                    { id: 'HTV-002', name: 'Imran Khan', bus: 'MUST-01' }
                ];
                const foundDriver = driversList.find(d => d.id === inputVal);
                if(!foundDriver || password.length < 4) {
                    errorMsg.innerText = 'Invalid Driver License No. or Password.';
                    errorMsg.style.display = 'block';
                    return;
                }
                localStorage.setItem('uniGoCurrentDriver', JSON.stringify(foundDriver));
            } else {
                const session = document.getElementById('studentSession').value;
                const login = loginStudent(session, inputVal, password);
                if (!login.ok) {
                    errorMsg.innerText = login.error;
                    errorMsg.style.display = 'block';
                    return;
                }
            }

            text.style.display = 'none';
            spinner.style.display = 'block';

            setTimeout(() => {
                if(role === 'admin') {
                    window.location.href = 'views/admin/dashboard.html';
                } else if(role === 'driver') {
                    window.location.href = 'views/driver/dashboard.html';
                } else {
                    window.location.href = 'views/student/dashboard.html';
                }
            }, 800);
        }
        function hydrateStudentSessions() {
            ensureStudentsSeeded();
            const sel = document.getElementById('studentSession');
            sel.innerHTML = '';
            MUST_SESSIONS.forEach((session) => {
                const opt = document.createElement('option');
                opt.value = session;
                opt.textContent = session;
                sel.appendChild(opt);
            });
        }
        document.addEventListener('DOMContentLoaded', hydrateStudentSessions);
    </script>

    <script>
        
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('mainContent');
        if(window.innerWidth <= 768) {
            sidebar.classList.toggle('mobile-open');
        } else {
            sidebar.classList.toggle('collapsed');
            if(main) main.classList.toggle('expanded');
        }
    }

    function initTheme() {
            const isLight = localStorage.getItem('theme') === 'light';
            if (isLight) document.body.classList.add('light-mode');
            updateThemeIcon();
        }
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            const isLight = document.body.classList.contains('light-mode');
            btn.innerHTML = isLight
                ? '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>'
                : '<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
        }
        document.addEventListener('DOMContentLoaded', initTheme);
    </script>

</body>

</html>
